<!-- Mermaid：把 ```mermaid 代码块渲染成流程图 / 时序图 / 架构图 -->
<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
  document.addEventListener('DOMContentLoaded', () => {
    // kramdown + rouge 会把 ```mermaid 输出成 div.language-mermaid > div.highlight > pre > code，这里统一替换
    document.querySelectorAll('div.language-mermaid, pre > code.language-mermaid').forEach((el) => {
      const code = el.tagName === 'CODE' ? el : el.querySelector('code');
      const div = document.createElement('div');
      div.className = 'mermaid';
      div.textContent = code.textContent;
      (el.tagName === 'CODE' ? el.parentElement : el).replaceWith(div);
    });
    const dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    mermaid.initialize({ startOnLoad: false, theme: dark ? 'dark' : 'default', securityLevel: 'strict' });
    mermaid.run({ querySelector: '.mermaid' });
  });
</script>
<style>
  .mermaid { text-align: center; margin: 1.2em 0; overflow-x: auto; }
</style>
